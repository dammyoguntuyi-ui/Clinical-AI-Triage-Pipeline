version: '3.8'

services:
  # Service 1: Background data engine loop (Runs headless script)
  streamer:
    build: .
    container_name: fhir_mock_streamer
    command: python scripts/mock_streamer.py
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  # Service 2: The interactive user interface dashboard
  dashboard:
    build: .
    container_name: clinical_ai_dashboard
    command: python -m streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - streamer