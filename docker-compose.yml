version: '3.8'

services:
  mock_streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical_mock_streamer
    # Keeps the streamer running in the background using your python process command
    command: python scripts/mock_streamer.py
    volumes:
      - .:/app
    networks:
      - clinical_triage_net
    restart: on-failure:3
    healthcheck:
      # Uses Python directly to test if port 5000 is open and accepting connections
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 5000))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical_api_service
    # Runs the FastAPI FHIR ingestion and telemetry microservice
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - clinical_triage_net
    restart: always

  frontend_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical_triage_dashboard
    # Runs the streamlit frontend out of the same base build image
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    networks:
      - clinical_triage_net
    depends_on:
      mock_streamer:
        condition: service_healthy
      api:
        condition: service_started
    restart: always
# -------------------------------------------------------------
  # NextGen Mirth Connect HL7 / MLLP Integration Engine
  # -------------------------------------------------------------
  mirth_connect:
    image: nextgenhealthcare/connect:latest
    container_name: clinical_mirth_connect
    ports:
      - "8443:8443"  # Mirth Web Administrator
      - "6661:6661"  # MLLP Ingestion Port
    volumes:
      - mirth_appdata:/opt/connect/appdata
    networks:
      - clinical_triage_net
    restart: always
networks:
  clinical_triage_net:
    driver: bridge

volumes:
  mirth_appdata:
    external: true
    name: mirth-integration_mirth_appdata