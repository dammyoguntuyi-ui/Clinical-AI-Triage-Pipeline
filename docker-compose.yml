version: '3.8'

services:
  # Service 1: The background FHIR data streaming engine
  streamer:
    build: .
    container_name: fhir_mock_streamer
    command: python scripts/mock_streamer.py
    volumes:
      - .:/app  # Mounts your local workspace so files write back to your machine

  # Service 2: The frontend UI interface dashboard
  dashboard:
    build: .
    container_name: clinical_ai_dashboard
    command: python -m streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app  # Shares the exact same folder structure with the streamer container
    depends_on:
      - streamer