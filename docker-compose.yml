version: '3.8'

services:
  # 1. The Orthanc PACS Container
  orthanc-pacs:
    image: jodogne/orthanc
    container_name: orthanc-pacs
    ports:
      - "8042:8042"  # REST API Port
      - "4242:4242"  # DICOM DICOM C-STORE Port
    volumes:
      - ./test_images:/tmp/orthanc_drop  # Links your local folder to orthanc's playground
    environment:
      - ORTHANC_NAME=Local_Triage_PACS
    restart: unless-stopped

  # 2. The Asynchronous File Listener Container
  triage-listener:
    build: .
    container_name: triage-listener
    restart: always
    # Executes watch_pacs.py from the root context directory
    command: python scripts/watch_pacs.py
    volumes:
      - .:/app  # Live syncs your folders so data/ and test_images/ update in real-time
    depends_on:
      - orthanc-pacs

  # 3. The Streamlit Interface Container
  triage-dashboard:
    build: .
    container_name: triage-dashboard
    restart: always
    # Launches Streamlit directly over the virtual network boundary
    command: python -m streamlit run scripts/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app  # Shares the live data/ folder generated by triage-listener
    depends_on:
      - triage-listener